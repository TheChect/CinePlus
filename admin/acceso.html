<!DOCTYPE html>
<!-- Cine+ · Acceso administrativo (solo diseño, todavía no valida) -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo · Cine+</title>
  <!-- Los estilos están una carpeta arriba, por eso se usa ../ -->
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="acceso-admin">

  <div class="caja-formulario tarjeta">
    <div class="acceso-logo">
      <span class="logo-cuadro"></span>
    </div>
    <h2 class="centrado">Panel administrativo</h2>
    <p class="texto-suave chico centrado">Ingresa tus credenciales para gestionar la plataforma.</p>

    <form action="#">
      <label for="usuario">Correo o usuario</label>
      <input class="campo" type="text" id="usuario" placeholder="admin@cineplus.com">

      <label for="contrasena">Contraseña</label>
      <input class="campo" type="password" id="contrasena" placeholder="••••••••">

      <div class="acceso-opciones chico">
        <label class="casilla"><input type="checkbox"> Recordar sesión</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Mensaje de error de ejemplo (después se mostrará solo si fallan los datos) -->
      <p class="alerta-error chico">Usuario o contraseña incorrectos.</p>

      <!-- Por ahora el botón solo lleva al panel para ver el diseño -->
      <a class="btn btn-primario btn-bloque" href="panel.html">Iniciar sesión</a>
    </form>

    <p class="cambio chico"><a href="../index.html">&larr; Volver al sitio</a></p>
  </div>

  <p class="pie-copy centrado">© 2026 Cine+. Acceso exclusivo para administradores.</p>

</body>
</html>
